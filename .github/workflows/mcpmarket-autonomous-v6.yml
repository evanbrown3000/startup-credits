name: MCP Market title-verified seller publication v6

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket-v6/trigger.txt'
      - 'automation/mcpmarket-v6/publisher.js.gz.b64.part-*'
      - 'automation/mcpmarket-v3/product/**'
  push:
    branches:
      - 'agent/mcpmarket-v3-1500'
    paths:
      - 'automation/mcpmarket-v6/trigger.txt'
      - 'automation/mcpmarket-v6/publisher.js.gz.b64.part-*'
      - 'automation/mcpmarket-v3/product/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-title-verified-v6
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress --no-audit --no-fund install playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Reassemble, patch the live signup race, and verify publisher
        shell: bash
        run: |
          set -euo pipefail
          cat automation/mcpmarket-v6/publisher.js.gz.b64.part-* > /tmp/publisher.js.gz.b64
          base64 -d /tmp/publisher.js.gz.b64 > /tmp/publisher.js.gz
          echo '427128cf2c1cf84bde2363cdbbd57cfaed0d198025f3e6bee4d6eaa30fbfae5c  /tmp/publisher.js.gz' | sha256sum -c -
          gzip -dc /tmp/publisher.js.gz > "$GITHUB_WORKSPACE/mcpmarket-publisher-v6.js"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mcpmarket-publisher-v6.js')
          source = path.read_text()
          old = """    await page.goto('https://app.mcpmarket.com/signup', { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.getByRole('button', { name: /^sign up with email$/i }).click({ timeout: 12000 });
              const name=page.getByLabel(/^name$/i);if(await name.count())await name.fill('Evan Brown');else await page.getByPlaceholder(/your name/i).fill('Evan Brown');
              await page.locator('input[type=email]').fill(address);await page.locator('input[type=password]').fill(p.provider_password);
"""
          new = """    await page.goto('https://app.mcpmarket.com/signup', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const emailChoice = page.getByRole('button', { name: /^sign up with email$/i });
              await emailChoice.waitFor({ state: 'visible', timeout: 12000 });
              await emailChoice.click({ timeout: 12000, force: true });
              await page.waitForTimeout(700);
              if (!(await page.locator('input[type=email]').count())) {
                await emailChoice.evaluate((element) => element.click());
                await page.waitForTimeout(1200);
              }
              const emailField = page.locator('input[type=email]');
              const passwordField = page.locator('input[type=password]');
              await emailField.waitFor({ state: 'visible', timeout: 12000 });
              await passwordField.waitFor({ state: 'visible', timeout: 12000 });
              const textFields = page.locator('input:not([type=email]):not([type=password]):not([type=hidden]):not([type=checkbox]):not([type=radio])');
              if (await textFields.count()) await textFields.first().fill('Evan Brown');
              await emailField.fill(address);
              await passwordField.fill(p.provider_password);
"""
          if old not in source:
              raise SystemExit('expected signup block not found; refusing an unbounded patch')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check "$GITHUB_WORKSPACE/mcpmarket-publisher-v6.js"
      - name: Start selling, upload the $19 skill, and prove our own listing state
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/mcpmarket-publisher-v6.js"
      - name: Encrypt durable account custody to owner keys
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/mcpmarket-custody.json ]; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq age >/dev/null
            curl -fsSL https://github.com/evanbrown3000.keys -o /tmp/owner.keys
            test -s /tmp/owner.keys
            age -a -R /tmp/owner.keys -o /tmp/mcpmarket-custody.age /tmp/mcpmarket-custody.json
            shred -u /tmp/mcpmarket-custody.json || rm -f /tmp/mcpmarket-custody.json
          fi
      - name: Post exact terminal result and encrypted custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/mcpmarket-result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income":0}' > /tmp/mcpmarket-result.json
          {
            echo '<!-- mcpmarket-v6-terminal -->'
            echo '**MCP Market title-verified publisher v6 — terminal result**'
            echo '```json'
            cat /tmp/mcpmarket-result.json
            echo '```'
            if [ -s /tmp/mcpmarket-custody.age ]; then
              echo '**Encrypted account custody (age; Evan GitHub SSH recipients):**'
              echo '```text'
              cat /tmp/mcpmarket-custody.age
              echo '```'
            fi
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/comment.md >/dev/null
