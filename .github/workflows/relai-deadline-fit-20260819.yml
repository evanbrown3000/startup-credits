name: RelAI Deadline-Fit Publisher

on:
  push:
    branches:
      - relai-deadline-fit-v1
    paths:
      - .github/workflows/relai-deadline-fit-20260819.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relai-deadline-fit-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap fresh RelAI identity and publish one paid API
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --no-save --package-lock=false ethers@6 >/dev/null 2>&1
          export OUTDIR="$GITHUB_WORKSPACE/relai"
          mkdir -p "$OUTDIR"
          node <<'NODE'
          const fs = require('fs');
          const { Wallet } = require('ethers');

          const OUTDIR = process.env.OUTDIR;
          const bootstrapUrl = 'https://api.relai.fi/mcp/management/bootstrap/agent';
          const originBase = 'https://raw.githubusercontent.com/evanbrown3000/startup-credits/relai-deadline-fit-v1/relai';
          const originPath = '/marketplace-deadline-fit.json';
          const originUrl = originBase + originPath;
          const productName = 'Cognilode Marketplace Deadline-Fit Matrix';

          async function jsonOrThrow(res, label) {
            let body;
            try { body = await res.json(); } catch { body = {}; }
            if (!res.ok) throw new Error(`${label} failed HTTP ${res.status}: ${body.error || 'no error detail'}`);
            return body;
          }

          (async () => {
            const origin = await fetch(originUrl, { redirect: 'follow' });
            if (!origin.ok) throw new Error(`origin not public: HTTP ${origin.status}`);
            const originText = await origin.text();
            JSON.parse(originText);

            const wallet = Wallet.createRandom();

            const challengeRes = await fetch(bootstrapUrl, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ publicKey: wallet.address })
            });
            const challenge = await jsonOrThrow(challengeRes, 'RelAI challenge');
            if (!challenge.message) throw new Error('RelAI challenge missing message');

            const signature = await wallet.signMessage(challenge.message);
            const keyRes = await fetch(bootstrapUrl, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                publicKey: wallet.address,
                signature,
                message: challenge.message,
                label: 'cognilode-deadline-fit-20260819'
              })
            });
            const keyBody = await jsonOrThrow(keyRes, 'RelAI service-key bootstrap');
            if (!keyBody.key || !String(keyBody.key).startsWith('sk_live_')) {
              throw new Error('RelAI bootstrap returned no live service key');
            }
            const serviceKey = keyBody.key;

            const createBody = {
              name: productName,
              baseUrl: originBase,
              description: 'Machine-readable business dataset screening API/digital marketplaces by listing cost, seller economics, payout/settlement latency, and deadline fit.',
              network: 'base',
              x402Version: 2,
              merchantWallet: wallet.address,
              websiteUrl: 'https://github.com/evanbrown3000/startup-credits/blob/relai-deadline-fit-v1/relai/marketplace-deadline-fit.json',
              endpoints: [{
                path: originPath,
                method: 'get',
                usdPrice: 0.01,
                description: 'Current machine-readable marketplace deadline-fit matrix.'
              }]
            };

            const createRes = await fetch('https://api.relai.fi/v1/apis', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'X-Service-Key': serviceKey
              },
              body: JSON.stringify(createBody)
            });
            const created = await jsonOrThrow(createRes, 'RelAI API registration');
            const apiId = created.apiId;
            if (!apiId) throw new Error('RelAI registration missing apiId');

            const relayUrl = `https://api.relai.fi/relay/${apiId}${originPath}`;
            const relay = await fetch(relayUrl, { method: 'GET', redirect: 'manual' });
            const relayStatus = relay.status;
            if (relayStatus !== 402) {
              throw new Error(`RelAI paid relay did not return HTTP 402; got ${relayStatus}`);
            }

            let marketplaceVisible = false;
            try {
              const marketHtml = await (await fetch('https://relai.fi/market')).text();
              marketplaceVisible = marketHtml.toLowerCase().includes(productName.toLowerCase());
            } catch {}

            const credentials = {
              provider: 'RelAI',
              createdAt: new Date().toISOString(),
              walletAddress: wallet.address,
              walletPrivateKey: wallet.privateKey,
              serviceKey,
              apiId,
              relayUrl,
              originUrl
            };
            fs.writeFileSync(`${OUTDIR}/credentials.json`, JSON.stringify(credentials, null, 2), { mode: 0o600 });

            const result = {
              provider: 'RelAI',
              product: productName,
              account_created: true,
              authenticated_via_service_key: true,
              wallet_address: wallet.address,
              api_id: apiId,
              provider_status: created.status ?? null,
              origin_http: origin.status,
              relay_url: relayUrl,
              relay_http_without_payment: relayStatus,
              paid_relay_live: relayStatus === 402,
              price_usd_per_call: 0.01,
              public_marketplace_visible_in_html_check: marketplaceVisible,
              marketplace_review_expected: marketplaceVisible ? 'already_visible' : 'not_yet_verified_visible; provider docs say typically 24-48h review',
              verified_buyer_income_usd: 0,
              checked_at: new Date().toISOString()
            };
            fs.writeFileSync(`${OUTDIR}/result.json`, JSON.stringify(result, null, 2));
          })().catch(err => {
            console.error(String(err.message || err));
            process.exit(1);
          });
          NODE

      - name: Encrypt reusable RelAI custody to existing GitHub SSH recipient
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
          curl -fsSL https://github.com/evanbrown3000.keys | grep -E '^ssh-(ed25519|rsa) ' > /tmp/recipients.txt
          test -s /tmp/recipients.txt
          age -R /tmp/recipients.txt -o relai/credentials.age relai/credentials.json
          rm -f relai/credentials.json /tmp/recipients.txt

      - name: Persist only redacted result and encrypted custody
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cognilode-relai-publisher'
          git config user.email 'evanbrown3000@users.noreply.github.com'
          git add relai/result.json relai/credentials.age
          git commit -m 'Record RelAI publication result and encrypted custody'
          git push origin HEAD:relai-deadline-fit-v1
