name: MCP Market compact autonomous publisher v4

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket-mailtm-v4/trigger.txt'
      - 'automation/mcpmarket-mailtm/product/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-mailtm-v4-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PRODUCT_PATH: automation/mcpmarket-mailtm/product/SKILL.md
      PRODUCT_TITLE: Provider Reality Check
      PRODUCT_DESCRIPTION: Verify whether a marketplace or API provider is actually executable now before wasting time on stale documentation, dead authentication paths, or unusable payout economics.
      PRODUCT_PRICE: '19'
      SELLER_NAME: Cognilode
      SCRIPT_GZIP_B64: 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare preinstalled browser and script
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress --no-audit --no-fund install playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          printf '%s' "$SCRIPT_GZIP_B64" | base64 -d | gzip -d > /tmp/mcpmarket-v4.mjs
          node --check /tmp/mcpmarket-v4.mjs
      - name: Execute account-to-publication path
        shell: bash
        run: node /tmp/mcpmarket-v4.mjs
      - name: Encrypt account custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/mcpmarket-v4-custody.json ]; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq age >/dev/null
            curl -fsSL https://github.com/evanbrown3000.keys -o /tmp/owner.keys
            test -s /tmp/owner.keys
            age -a -R /tmp/owner.keys -o /tmp/mcpmarket-v4-custody.age /tmp/mcpmarket-v4-custody.json
            shred -u /tmp/mcpmarket-v4-custody.json || rm -f /tmp/mcpmarket-v4-custody.json
          fi
      - name: Post exact terminal provider result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/mcpmarket-v4-result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income_usd":0}' > /tmp/mcpmarket-v4-result.json
          {
            echo '<!-- mcpmarket-v4-terminal -->'
            echo '**MCP Market compact publisher v4 — terminal result**'
            echo '```json'
            cat /tmp/mcpmarket-v4-result.json
            echo '```'
            if [ -s /tmp/mcpmarket-v4-custody.age ]; then
              echo '**Encrypted account custody (age, Evan SSH recipients):**'
              echo '```text'
              cat /tmp/mcpmarket-v4-custody.age
              echo '```'
            fi
          } >/tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/comment.md >/dev/null
