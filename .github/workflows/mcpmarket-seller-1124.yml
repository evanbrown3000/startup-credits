name: mcpmarket-seller-signup-1124

on:
  push:
    branches:
      - agent/mcpmarket-seller-1124
    paths:
      - .github/workflows/mcpmarket-seller-1124.yml

permissions:
  contents: write

concurrency:
  group: mcpmarket-seller-1124
  cancel-in-progress: false

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROVIDER_EMAIL: evanbrown.engineering+mcpmarket20260819@gmail.com
      PROVIDER_NAME: Evan Brown
      PROVIDER_SEED: ${{ secrets.CM_TARGET_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcpmarket-seller-1124
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm --silent --no-progress --no-audit --no-fund install playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Create one MCP Market email account
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/mcpmarket
          if [ -z "${PROVIDER_SEED:-}" ]; then
            printf '%s\n' '{"status":"missing_repo_secret","provider":"mcpmarket","provider_mutation":false}' > automation/mcpmarket/result.json
            exit 0
          fi
          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('crypto');
          const fs = require('fs');
          (async () => {
            const email = process.env.PROVIDER_EMAIL;
            const name = process.env.PROVIDER_NAME;
            const seed = process.env.PROVIDER_SEED;
            const raw = crypto.createHmac('sha256', seed).update('mcpmarket-seller-20260819-v1').digest('base64url');
            const password = `Mm!${raw.slice(0,22)}9a`;
            fs.writeFileSync('/tmp/mcpmarket-password', password, { mode: 0o600 });
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const out = {provider:'mcpmarket', email, provider_mutation:false, created:false, needs_email_confirmation:false, status:'unknown'};
            try {
              await page.goto('https://app.mcpmarket.com/signup', { waitUntil: 'domcontentloaded', timeout: 45000 });
              const emailButton = page.getByRole('button', { name: /sign up with email/i });
              await emailButton.click({ timeout: 15000 });
              await page.waitForTimeout(500);
              const labels = await page.locator('label').allTextContents().catch(()=>[]);
              const placeholders = await page.locator('input').evaluateAll(els => els.map(e => ({name:e.name,type:e.type,placeholder:e.placeholder,autocomplete:e.autocomplete})));
              async function fillFirst(candidates, value) {
                for (const loc of candidates) {
                  try { if (await loc.count()) { await loc.first().fill(value); return true; } } catch(e) {}
                }
                return false;
              }
              const nameOk = await fillFirst([
                page.getByLabel(/name/i), page.locator('input[name="name"]'), page.locator('input[autocomplete="name"]')
              ], name);
              const emailOk = await fillFirst([
                page.getByLabel(/email/i), page.locator('input[type="email"]'), page.locator('input[name="email"]')
              ], email);
              const passOk = await fillFirst([
                page.getByLabel(/password/i), page.locator('input[type="password"]'), page.locator('input[name="password"]')
              ], password);
              out.form = {nameOk,emailOk,passOk,labels,placeholders};
              if (!emailOk || !passOk) throw new Error('signup_fields_not_found');
              const submit = page.getByRole('button', { name: /create account|sign up|continue/i });
              await submit.last().click({ timeout: 15000 });
              await page.waitForTimeout(2500);
              const body = (await page.locator('body').innerText()).slice(0,5000);
              out.final_url = page.url();
              out.body_excerpt = body.replace(/\s+/g,' ').slice(0,1800);
              const lower = body.toLowerCase();
              if (lower.includes('confirm') && lower.includes('email') || lower.includes('check your email') || lower.includes('verification')) {
                out.status = 'confirmation_required'; out.needs_email_confirmation = true; out.provider_mutation = true; out.created = true;
              } else if (!page.url().includes('/signup')) {
                out.status = 'created_or_onboarding'; out.provider_mutation = true; out.created = true;
              } else if (lower.includes('already') && lower.includes('account')) {
                out.status = 'already_exists';
              } else {
                out.status = 'signup_unconfirmed';
              }
            } catch (e) {
              out.status = 'error'; out.error = String(e.message || e).slice(0,800);
              try { out.final_url = page.url(); out.body_excerpt=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,1800); } catch(_) {}
            } finally {
              await browser.close();
            }
            fs.writeFileSync('automation/mcpmarket/result.json', JSON.stringify(out,null,2)+'\n');
          })().catch(e => { console.error('runner_error:', e.message); process.exit(1); });
          NODE
      - name: Encrypt generated credential to owner SSH key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/mcpmarket-password ]; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y age >/dev/null
            curl -fsSL https://github.com/evanbrown3000.keys -o /tmp/recipients.txt
            test -s /tmp/recipients.txt
            age -R /tmp/recipients.txt -a -o automation/mcpmarket/password.age /tmp/mcpmarket-password
            shred -u /tmp/mcpmarket-password || rm -f /tmp/mcpmarket-password
          fi
      - name: Persist redacted result and encrypted custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cognilode-provider-carrier'
          git config user.email 'evanbrown.engineering@gmail.com'
          git add automation/mcpmarket/result.json automation/mcpmarket/password.age 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: record MCP Market signup result'
          git push origin HEAD:agent/mcpmarket-seller-1124
