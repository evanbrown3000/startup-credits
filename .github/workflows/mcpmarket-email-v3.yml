name: MCP Market email publisher v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket/email-v3-trigger.txt'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-interactive-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PROVIDER_EMAIL: evanbrown3000+mcpmarket1400@gmail.com
      PROVIDER_NAME: Evan Brown
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress --no-audit --no-fund install playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Create exact email account and encrypted input channel
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=mcpmarket-email-v3' \
            -keyout /tmp/channel-key.pem -out /tmp/channel-cert.pem >/dev/null 2>&1
          CERT_B64="$(base64 -w0 /tmp/channel-cert.pem)"
          {
            echo '<!-- mcpmarket-v3-cert -->'
            echo '**MCP Market v3 encrypted channel**'
            echo '```text'
            echo "$CERT_B64"
            echo '```'
          } >/tmp/cert-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/cert-comment.md >/dev/null

          node <<'NODE'
          const { chromium } = require('playwright-core');
          const crypto = require('crypto');
          const fs = require('fs');
          const compact=(s,n=2800)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          async function one(page, primary, fallback) {
            try { const x=page.getByLabel(primary); if(await x.count()){return x.first();} } catch(_) {}
            return fallback();
          }
          (async()=>{
            const email=process.env.PROVIDER_EMAIL;
            const password=`Mm!${crypto.randomBytes(30).toString('base64url')}9a`;
            fs.writeFileSync('/tmp/provider-password',password,{mode:0o600});
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const out={provider:'mcpmarket.com',email,provider_mutation:false,account_created:false,status:'unknown'};
            try {
              await page.goto('https://app.mcpmarket.com/signup',{waitUntil:'domcontentloaded',timeout:45000});
              await page.getByRole('button',{name:/^sign up with email$/i}).click({timeout:12000});
              const nameInput=await one(page,/^name$/i,()=>page.getByPlaceholder(/your name/i));
              const emailInput=await one(page,/^email$/i,()=>page.locator('input[type=email]'));
              const passwordInput=await one(page,/^password$/i,()=>page.locator('input[type=password]'));
              await nameInput.fill(process.env.PROVIDER_NAME);
              await emailInput.fill(email);
              await passwordInput.fill(password);
              const create=page.getByRole('button',{name:/^create account$/i});
              if(await create.count()) await create.last().click({timeout:12000});
              else await page.locator('form button[type=submit]').last().click({timeout:12000});
              await page.waitForTimeout(2600);
              const body=compact(await page.locator('body').innerText());
              out.url=page.url(); out.body_excerpt=body;
              if(/check your email|confirmation link|verify your email/i.test(body)){
                out.provider_mutation=true; out.account_created=true; out.status='confirmation_required';
              } else if(/already.*account/i.test(body)) out.status='already_exists';
              else out.status='signup_unclassified';
            } catch(e) {
              out.status='error'; out.error=String(e.message||e).slice(0,900);
              try { out.url=page.url(); out.body_excerpt=compact(await page.locator('body').innerText()); } catch(_) {}
            }
            await browser.close();
            fs.writeFileSync('/tmp/signup.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          {
            echo '<!-- mcpmarket-v3-signup -->'
            echo '**MCP Market v3 account result**'
            echo '```json'
            cat /tmp/signup.json
            echo '```'
            echo 'The live job is waiting for one CMS-encrypted confirmation URL and private skill payload.'
          } >/tmp/signup-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/signup-comment.md >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/signup.json'))
          if d.get('status')!='confirmation_required':
              raise SystemExit('email account was not created; refusing to wait for payload')
          PY
      - name: Receive confirmation URL and private product
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/input.cms.b64
          for _ in $(seq 1 96); do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" >/tmp/comments.json
            if python3 - <<'PY'
          import json,re,sys
          comments=json.load(open('/tmp/comments.json'))
          bodies=[c.get('body','') for c in comments if '<!-- mcpmarket-v3-input -->' in c.get('body','')]
          if not bodies: sys.exit(1)
          m=re.search(r'<!-- mcpmarket-v3-input -->\s*```(?:text)?\s*([A-Za-z0-9+/=\r\n]+?)\s*```',bodies[-1],re.S)
          if not m: sys.exit(1)
          open('/tmp/input.cms.b64','w').write(''.join(m.group(1).split()))
          PY
            then break; fi
            sleep 10
          done
          test -s /tmp/input.cms.b64
          base64 -d /tmp/input.cms.b64 >/tmp/input.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/input.cms \
            -recip /tmp/channel-cert.pem -inkey /tmp/channel-key.pem -out /tmp/input.json
          python3 - <<'PY'
          import base64,json,os
          p=json.load(open('/tmp/input.json'))
          for k in ('confirmation_url','skill_md_b64','title','description','price'):
              if not p.get(k): raise SystemExit('missing '+k)
          os.makedirs('/tmp/product',exist_ok=True)
          open('/tmp/product/SKILL.md','wb').write(base64.b64decode(p['skill_md_b64']))
          PY
      - name: Confirm, authenticate, onboard seller, and publish
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/input.json','utf8'));
          const email=process.env.PROVIDER_EMAIL;
          const password=fs.readFileSync('/tmp/provider-password','utf8');
          const skillPath='/tmp/product/SKILL.md';
          const compact=(s,n=3500)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          async function snapshot(page,label){
            return {label,url:page.url(),title:await page.title().catch(()=>''),body:compact(await page.locator('body').innerText().catch(()=>'')),buttons:(await page.getByRole('button').allTextContents().catch(()=>[])).slice(0,70),links:(await page.locator('a').evaluateAll(es=>es.slice(0,100).map(e=>({text:(e.innerText||'').trim().slice(0,120),href:e.href}))).catch(()=>[])),inputs:(await page.locator('input,textarea,select').evaluateAll(es=>es.slice(0,80).map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',accept:e.accept||''}))).catch(()=>[]))};
          }
          async function clickExact(page, regex){
            for(const loc of [page.getByRole('button',{name:regex}),page.getByRole('link',{name:regex})]){
              try{if(await loc.count()){await loc.last().click({timeout:8000});return true}}catch(_){}
            }
            return false;
          }
          async function fillLabeled(page, regexes, value){
            for(const regex of regexes){
              for(const loc of [page.getByLabel(regex),page.getByPlaceholder(regex)]){
                try{if(await loc.count()){await loc.first().fill(String(value));return true}}catch(_){}
              }
            }
            return false;
          }
          async function fillMeta(page, regex, value){
            const nodes=page.locator('input,textarea');
            for(let i=0;i<await nodes.count();i++){
              const node=nodes.nth(i);
              const meta=((await node.getAttribute('name'))||'')+' '+((await node.getAttribute('placeholder'))||'')+' '+((await node.getAttribute('aria-label'))||'');
              if(regex.test(meta)){try{await node.fill(String(value));return true}catch(_){}}
            }
            return false;
          }
          (async()=>{
            const out={provider:'mcpmarket.com',email,confirmation_attempted:false,email_confirmed:false,authenticated:false,seller_onboarding:false,skill_uploaded:false,listing_published:false,public_url:null,price:Number(p.price),income:0,status:'started',snapshots:[]};
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            try {
              out.confirmation_attempted=true;
              await page.goto(p.confirmation_url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              let body=compact(await page.locator('body').innerText());
              out.email_confirmed=!/invalid|expired|unable to verify|error/i.test(body);
              out.snapshots.push(await snapshot(page,'confirmation'));

              await page.goto('https://app.mcpmarket.com/login',{waitUntil:'domcontentloaded',timeout:45000});
              await page.getByRole('button',{name:/^log in with email$/i}).click({timeout:12000});
              await page.locator('input[type=email]').fill(email);
              await page.locator('input[type=password]').fill(password);
              const login=page.getByRole('button',{name:/^log in$/i});
              if(await login.count()) await login.last().click({timeout:12000});
              else await page.locator('form button[type=submit]').last().click({timeout:12000});
              await page.waitForTimeout(2600);
              body=compact(await page.locator('body').innerText());
              out.authenticated=!page.url().includes('/login')&&!/invalid.*password|welcome back/i.test(body);
              out.snapshots.push(await snapshot(page,'post-login'));

              await page.goto('https://app.mcpmarket.com/sell?source=sell-page',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              out.snapshots.push(await snapshot(page,'seller-entry'));

              for(let step=0;step<18;step++){
                body=compact(await page.locator('body').innerText());
                const lower=body.toLowerCase();
                if(/published|listing is live|view public page|live paid/i.test(lower)){out.listing_published=true;break;}

                if(/organization|workspace/.test(lower)){
                  await fillLabeled(page,[/organization name|workspace name/i],p.organization||'Cognilode');
                  await fillLabeled(page,[/slug|handle/i],p.organization_slug||'cognilode');
                  await fillMeta(page,/organization|workspace|name/i,p.organization||'Cognilode');
                  await fillMeta(page,/slug|handle/i,p.organization_slug||'cognilode');
                  if(await clickExact(page,/^create organization$|^create workspace$|^continue$|^next$/i)){out.seller_onboarding=true;await page.waitForTimeout(1500);out.snapshots.push(await snapshot(page,`organization-${step}`));continue;}
                }

                if(/storefront|seller profile|start selling|set up.*store/.test(lower)){
                  await fillLabeled(page,[/display name|seller name/i],p.seller_name||'Cognilode');
                  await fillLabeled(page,[/handle|username|slug/i],p.handle||'cognilode');
                  await fillLabeled(page,[/bio|about|description/i],p.seller_bio||'Evidence-driven agent skills for commercial execution and provider validation.');
                  if(await clickExact(page,/^start selling$|^set up.*store$|^create.*seller$|^save$|^continue$|^next$/i)){out.seller_onboarding=true;await page.waitForTimeout(1500);out.snapshots.push(await snapshot(page,`seller-${step}`));continue;}
                }

                if(/connect stripe|payout|payments setup/i.test(lower)){
                  if(await clickExact(page,/^skip for now$|^do this later$|^continue without payouts$/i)){await page.waitForTimeout(1200);out.snapshots.push(await snapshot(page,`payout-skip-${step}`));continue;}
                }

                const fileInput=page.locator('input[type=file]');
                if(await fileInput.count()){
                  await fileInput.first().setInputFiles(skillPath);out.skill_uploaded=true;await page.waitForTimeout(1400);out.snapshots.push(await snapshot(page,`uploaded-${step}`));
                } else if(await clickExact(page,/^upload.*skill$|^new skill$|^create skill$|^add skill$|^import skill$/i)){
                  await page.waitForTimeout(1400);out.snapshots.push(await snapshot(page,`open-upload-${step}`));continue;
                }

                await fillLabeled(page,[/skill name|listing title|title/i],p.title);
                await fillLabeled(page,[/description|summary/i],p.description);
                await fillLabeled(page,[/price|amount/i],p.price);
                await fillMeta(page,/title|skill.*name|listing.*name/i,p.title);
                await fillMeta(page,/description|summary/i,p.description);
                await fillMeta(page,/price|amount/i,p.price);

                if(await clickExact(page,/^publish$|^go live$|^create listing$|^save and publish$|^list skill$|^continue$|^next$|^save$/i)){
                  await page.waitForTimeout(2200);out.snapshots.push(await snapshot(page,`advance-${step}`));continue;
                }
                break;
              }

              body=compact(await page.locator('body').innerText());
              out.listing_published=out.listing_published||(/published|listing is live|view public page|live paid/i.test(body)&&!/not published|error/i.test(body));
              const links=await page.locator('a').evaluateAll(es=>es.map(e=>({t:(e.innerText||'').trim(),h:e.href})));
              out.public_url=(links.find(x=>/view public page|public listing|storefront/i.test(x.t))||links.find(x=>/mcpmarket\.com\/@|\/tools\/skills\//.test(x.h))||{}).h||null;
              out.status=out.listing_published?'published':'publish_incomplete';
              out.snapshots.push(await snapshot(page,'terminal'));
            } catch(e) {
              out.status='error';out.error=String(e.message||e).slice(0,1000);
              try{out.snapshots.push(await snapshot(page,'error'))}catch(_){}
            }
            out.finished_at=new Date().toISOString();
            await browser.close();
            fs.writeFileSync('/tmp/result.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Post terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income":0}' >/tmp/result.json
          {
            echo '<!-- mcpmarket-v3-terminal -->'
            echo '**MCP Market v3 terminal result**'
            echo '```json'
            cat /tmp/result.json
            echo '```'
          } >/tmp/result-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/result-comment.md >/dev/null
