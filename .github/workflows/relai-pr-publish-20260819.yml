name: RelAI Deadline-Fit PR Publisher

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: relai-deadline-fit-20260819
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relai-deadline-fit-v1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish one RelAI paid API
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false ethers@6 >/dev/null 2>&1
          export OUTDIR="$RUNNER_TEMP/relai-out"
          node relai/publish.mjs

      - name: Encrypt provider custody
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age >/dev/null
          curl -fsSL https://github.com/evanbrown3000.keys | grep -E '^ssh-(ed25519|rsa) ' > "$RUNNER_TEMP/recipients.txt"
          test -s "$RUNNER_TEMP/recipients.txt"
          age -R "$RUNNER_TEMP/recipients.txt" -o "$RUNNER_TEMP/relai-out/credentials.age" "$RUNNER_TEMP/relai-out/credentials.json"
          rm -f "$RUNNER_TEMP/relai-out/credentials.json" "$RUNNER_TEMP/recipients.txt"

      - name: Upload redacted result and encrypted custody
        uses: actions/upload-artifact@v4
        with:
          name: relai-deadline-fit-result
          path: |
            ${{ runner.temp }}/relai-out/result.json
            ${{ runner.temp }}/relai-out/credentials.age
          if-no-files-found: error
          retention-days: 1
