name: MCP Market autonomous seller publication v3

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket-v3/trigger.txt'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-autonomous-v3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress --no-audit --no-fund install playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Create account, confirm, onboard, and publish
        shell: bash
        env:
          SCRIPT_GZIP_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$SCRIPT_GZIP_B64" | base64 -d | gzip -d > /tmp/mcpmarket-v3.js
          node --check /tmp/mcpmarket-v3.js
          node /tmp/mcpmarket-v3.js
      - name: Encrypt custody to owner keys
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/mcpmarket-custody.json ]; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq age >/dev/null
            curl -fsSL https://github.com/evanbrown3000.keys -o /tmp/owner.keys
            test -s /tmp/owner.keys
            age -a -R /tmp/owner.keys -o /tmp/mcpmarket-custody.age /tmp/mcpmarket-custody.json
            shred -u /tmp/mcpmarket-custody.json || rm -f /tmp/mcpmarket-custody.json
          fi
      - name: Post terminal result and encrypted custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/mcpmarket-result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income":0}' >/tmp/mcpmarket-result.json
          {
            echo '<!-- mcpmarket-v3-terminal -->'
            echo '**MCP Market autonomous seller publication v3 — terminal result**'
            echo '```json'
            cat /tmp/mcpmarket-result.json
            echo '```'
            if [ -s /tmp/mcpmarket-custody.age ]; then
              echo '**Encrypted account custody (age; Evan GitHub SSH recipients):**'
              echo '```text'
              cat /tmp/mcpmarket-custody.age
              echo '```'
            fi
          } >/tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/comment.md >/dev/null
