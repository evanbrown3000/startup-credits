name: MCP Market password reset request

on:
  push:
    branches: [main]
    paths:
      - 'automation/mcpmarket/reset-trigger.txt'
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket/reset-trigger.txt'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-reset-request
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm --silent --no-progress --no-audit --no-fund install playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture public Supabase client credential and request recovery
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto'); const {chromium}=require('playwright');
          (async()=>{
            const email='evanbrown3000+mayachen.mcpmarket260819@gmail.com';
            const b=await chromium.launch({headless:true}); const p=await b.newPage();
            const out={provider:'mcpmarket',email,reset_requested:false,credential_capture:false}; let apikey=null, tokenUrl=null;
            p.on('request',req=>{
              const u=req.url();
              if(u.includes('mcpmarket.supabase.co') && u.includes('/auth/v1/token')){
                const h=req.headers(); apikey=h['apikey']||null; tokenUrl=u;
              }
            });
            try{
              await p.goto('https://app.mcpmarket.com/login',{waitUntil:'domcontentloaded',timeout:45000});
              const emailMode=p.getByRole('button',{name:/log in with email/i}); if(await emailMode.count()) await emailMode.click();
              await p.locator('input[type="email"]').first().fill(email);
              await p.locator('input[type="password"]').first().fill('ThisIsNotThePassword!2026');
              await p.getByRole('button',{name:/^sign in$/i}).click();
              for(let i=0;i<20&&!apikey;i++) await p.waitForTimeout(150);
              if(!apikey) throw new Error('public_supabase_apikey_not_observed');
              out.credential_capture=true; out.apikey_sha256=crypto.createHash('sha256').update(apikey).digest('hex');
              const base='https://mcpmarket.supabase.co/auth/v1/recover';
              const redirect='https://app.mcpmarket.com/auth/callback?next=%2Fdashboard';
              const r=await fetch(base+'?redirect_to='+encodeURIComponent(redirect),{
                method:'POST',headers:{'Content-Type':'application/json','apikey':apikey,'Authorization':'Bearer '+apikey},body:JSON.stringify({email})
              });
              const text=await r.text(); out.recover_http=r.status; out.recover_excerpt=text.replace(/\s+/g,' ').slice(0,1000); out.reset_requested=r.status>=200&&r.status<300;
            }catch(e){out.error=String(e.message||e).slice(0,1000)} finally{await b.close()}
            fs.writeFileSync('automation/mcpmarket/reset-result.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Publish observable PR result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test -f automation/mcpmarket/reset-result.json || printf '%s\n' '{"provider":"mcpmarket","reset_requested":false,"status":"result_missing"}' > automation/mcpmarket/reset-result.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -f body="$(cat automation/mcpmarket/reset-result.json)"
      - name: Persist reset request result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Maya Chen'
          git config user.email 'evanbrown3000@gmail.com'
          git pull --rebase origin main
          git add automation/mcpmarket/reset-result.json
          git commit -m 'chore: record MCP Market reset request' || exit 0
          git push origin HEAD:main
