name: MCP Market encrypted publisher fast

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket/interactive-fast-trigger.txt'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-interactive-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PROVIDER_EMAIL: evanbrown3000+mcpmarket1359@gmail.com
      PROVIDER_NAME: Evan Brown
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress --no-audit --no-fund install playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Open encrypted channel and create reachable seller account
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=mcpmarket-fast-run' \
            -keyout /tmp/mcpmarket-key.pem -out /tmp/mcpmarket-cert.pem >/dev/null 2>&1
          CERT_B64="$(base64 -w0 /tmp/mcpmarket-cert.pem)"
          {
            echo '<!-- mcpmarket-fast-cert -->'
            echo '**MCP Market fast encrypted channel**'
            echo '```text'
            echo "$CERT_B64"
            echo '```'
          } >/tmp/cert-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/cert-comment.md >/dev/null

          node <<'NODE'
          const { chromium } = require('playwright-core');
          const crypto = require('crypto');
          const fs = require('fs');
          const compact=(s,n=2200)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          async function click(page,re){for(const l of [page.getByRole('button',{name:re}),page.getByRole('link',{name:re}),page.getByText(re,{exact:false})]){try{if(await l.count()){await l.first().click({timeout:8000});return true}}catch(_){}}return false}
          async function fill(page,re,v){for(const l of [page.getByLabel(re),page.getByPlaceholder(re)]){try{if(await l.count()){await l.first().fill(String(v));return true}}catch(_){}}return false}
          (async()=>{
            const email=process.env.PROVIDER_EMAIL;
            const password=`Mm!${crypto.randomBytes(30).toString('base64url')}9a`;
            fs.writeFileSync('/tmp/mcpmarket-password',password,{mode:0o600});
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const out={provider:'mcpmarket.com',email,provider_mutation:false,account_created:false,status:'unknown'};
            try{
              await page.goto('https://app.mcpmarket.com/signup',{waitUntil:'domcontentloaded',timeout:45000});
              await click(page,/sign up with email/i);
              await fill(page,/name/i,process.env.PROVIDER_NAME);
              await fill(page,/email/i,email);
              await fill(page,/password/i,password);
              await click(page,/create account|sign up|continue/i);
              await page.waitForTimeout(2200);
              const body=compact(await page.locator('body').innerText());
              out.url=page.url();out.body_excerpt=body;
              if(/check your email|confirmation link|verify your email/i.test(body)){out.provider_mutation=true;out.account_created=true;out.status='confirmation_required'}
              else if(/already.*account/i.test(body)){out.status='already_exists'}
              else out.status='signup_unclassified';
            }catch(e){out.status='error';out.error=String(e.message||e).slice(0,800);try{out.url=page.url();out.body_excerpt=compact(await page.locator('body').innerText())}catch(_){}}
            await browser.close();
            fs.writeFileSync('/tmp/signup-result.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          {
            echo '<!-- mcpmarket-fast-signup -->'
            echo '**MCP Market fast account result**'
            echo '```json'
            cat /tmp/signup-result.json
            echo '```'
            echo 'Waiting for one CMS-encrypted confirmation URL and private SKILL.md payload.'
          } >/tmp/signup-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/signup-comment.md >/dev/null
      - name: Receive encrypted confirmation and product
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 108); do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" >/tmp/comments.json
            if python3 - <<'PY'
          import json,re,sys
          comments=json.load(open('/tmp/comments.json'))
          bodies=[c.get('body','') for c in comments if '<!-- mcpmarket-fast-input -->' in c.get('body','')]
          if not bodies: sys.exit(1)
          m=re.search(r'<!-- mcpmarket-fast-input -->\s*```(?:text)?\s*([A-Za-z0-9+/=\r\n]+?)\s*```',bodies[-1],re.S)
          if not m: sys.exit(1)
          open('/tmp/payload.cms.b64','w').write(''.join(m.group(1).split()))
          PY
            then break; fi
            sleep 10
          done
          test -s /tmp/payload.cms.b64
          base64 -d /tmp/payload.cms.b64 >/tmp/payload.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/payload.cms \
            -recip /tmp/mcpmarket-cert.pem -inkey /tmp/mcpmarket-key.pem -out /tmp/payload.json
          python3 - <<'PY'
          import base64,json,os
          p=json.load(open('/tmp/payload.json'))
          for k in ('confirmation_url','skill_md_b64','title','description','price'):
              if not p.get(k): raise SystemExit('missing '+k)
          os.makedirs('/tmp/mcpmarket-product',exist_ok=True)
          open('/tmp/mcpmarket-product/SKILL.md','wb').write(base64.b64decode(p['skill_md_b64']))
          PY
      - name: Confirm, login, onboard seller, and publish
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/payload.json','utf8'));
          const email=process.env.PROVIDER_EMAIL,password=fs.readFileSync('/tmp/mcpmarket-password','utf8'),skill='/tmp/mcpmarket-product/SKILL.md';
          const compact=(s,n=3200)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          async function snapshot(page,label){return{label,url:page.url(),title:await page.title().catch(()=>''),body:compact(await page.locator('body').innerText().catch(()=>'')),buttons:(await page.getByRole('button').allTextContents().catch(()=>[])).slice(0,60),links:(await page.locator('a').evaluateAll(es=>es.slice(0,90).map(e=>({text:(e.innerText||'').trim().slice(0,100),href:e.href}))).catch(()=>[])),inputs:(await page.locator('input,textarea,select').evaluateAll(es=>es.slice(0,70).map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',accept:e.accept||''}))).catch(()=>[]))}}
          async function click(page,re){for(const l of [page.getByRole('button',{name:re}),page.getByRole('link',{name:re}),page.getByText(re,{exact:false})]){try{if(await l.count()){await l.first().click({timeout:7000});return true}}catch(_){}}return false}
          async function fill(page,res,v){for(const re of res){for(const l of [page.getByLabel(re),page.getByPlaceholder(re)]){try{if(await l.count()){await l.first().fill(String(v));return true}}catch(_){}}}return false}
          async function fillMeta(page,re,v){const n=await page.locator('input,textarea').count();for(let i=0;i<n;i++){const e=page.locator('input,textarea').nth(i),m=((await e.getAttribute('name'))||'')+' '+((await e.getAttribute('placeholder'))||'')+' '+((await e.getAttribute('aria-label'))||'');if(re.test(m)){try{await e.fill(String(v));return true}catch(_){}}}return false}
          (async()=>{
            const out={provider:'mcpmarket.com',email,confirmation_attempted:false,email_confirmed:false,authenticated:false,seller_onboarding:false,skill_uploaded:false,listing_published:false,public_url:null,price:Number(p.price),income:0,status:'started',snapshots:[]};
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1440,height:1000}}),page=await context.newPage();
            try{
              out.confirmation_attempted=true;
              await page.goto(p.confirmation_url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1600);
              let body=compact(await page.locator('body').innerText());out.email_confirmed=!/invalid|expired|unable to verify|error/i.test(body);out.snapshots.push(await snapshot(page,'confirmation'));
              await page.goto('https://app.mcpmarket.com/login',{waitUntil:'domcontentloaded',timeout:45000});await click(page,/log in with email/i);await fill(page,[/email/i],email);await fill(page,[/password/i],password);await click(page,/log in|sign in|continue/i);await page.waitForTimeout(2200);
              body=compact(await page.locator('body').innerText());out.authenticated=!page.url().includes('/login')&&!/invalid.*password|welcome back/i.test(body);out.snapshots.push(await snapshot(page,'login'));
              await page.goto('https://app.mcpmarket.com/sell?source=sell-page',{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1500);out.snapshots.push(await snapshot(page,'seller-entry'));
              for(let s=0;s<16;s++){
                body=compact(await page.locator('body').innerText());const low=body.toLowerCase();
                if(/published|listing is live|view public page|live paid/i.test(low)){out.listing_published=true;break}
                if(/organization|workspace/.test(low)){await fill(page,[/organization name|workspace name/i],p.organization||'Cognilode');await fill(page,[/slug|handle/i],p.organization_slug||'cognilode');await fillMeta(page,/organization|workspace|name/i,p.organization||'Cognilode');await fillMeta(page,/slug|handle/i,p.organization_slug||'cognilode');if(await click(page,/create organization|create workspace|continue|next/i)){out.seller_onboarding=true;await page.waitForTimeout(1400);out.snapshots.push(await snapshot(page,`org-${s}`));continue}}
                if(/storefront|seller profile|start selling|set up.*store/.test(low)){await fill(page,[/display name|seller name|name/i],p.seller_name||'Cognilode');await fill(page,[/handle|username|slug/i],p.handle||'cognilode');await fill(page,[/bio|about|description/i],p.seller_bio||'Evidence-driven agent skills for commercial execution and provider validation.');if(await click(page,/start selling|set up.*store|create.*seller|save|continue|next/i)){out.seller_onboarding=true;await page.waitForTimeout(1400);out.snapshots.push(await snapshot(page,`seller-${s}`));continue}}
                if(await page.locator('input[type=file]').count()){await page.locator('input[type=file]').first().setInputFiles(skill);out.skill_uploaded=true;await page.waitForTimeout(1200);out.snapshots.push(await snapshot(page,`upload-${s}`))}
                else if(await click(page,/upload.*skill|upload skill\.md|new skill|create skill|add skill|connect skill|import skill/i)){await page.waitForTimeout(1200);out.snapshots.push(await snapshot(page,`open-upload-${s}`));continue}
                await fill(page,[/skill name|listing title|title|name/i],p.title);await fill(page,[/description|summary/i],p.description);await fill(page,[/price|amount/i],p.price);await fillMeta(page,/title|skill.*name|listing.*name/i,p.title);await fillMeta(page,/description|summary/i,p.description);await fillMeta(page,/price|amount/i,p.price);
                if(await click(page,/publish|go live|create listing|save and publish|list skill|continue|next|save/i)){await page.waitForTimeout(2000);out.snapshots.push(await snapshot(page,`advance-${s}`));continue}
                break;
              }
              body=compact(await page.locator('body').innerText());out.listing_published=out.listing_published||(/published|listing is live|view public page|live paid/i.test(body)&&!/not published|error/i.test(body));const links=await page.locator('a').evaluateAll(es=>es.map(e=>({t:(e.innerText||'').trim(),h:e.href})));out.public_url=(links.find(x=>/view public page|public listing|storefront/i.test(x.t))||links.find(x=>/mcpmarket\.com\/@|\/tools\/skills\//.test(x.h))||{}).h||null;out.status=out.listing_published?'published':'publish_incomplete';out.snapshots.push(await snapshot(page,'terminal'));
            }catch(e){out.status='error';out.error=String(e.message||e).slice(0,900);try{out.snapshots.push(await snapshot(page,'error'))}catch(_){}}
            out.finished_at=new Date().toISOString();await browser.close();fs.writeFileSync('/tmp/result.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Post terminal publication result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income":0}' >/tmp/result.json
          {
            echo '<!-- mcpmarket-fast-terminal -->'
            echo '**MCP Market fast publisher — terminal result**'
            echo '```json'
            cat /tmp/result.json
            echo '```'
          } >/tmp/result-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/result-comment.md >/dev/null
