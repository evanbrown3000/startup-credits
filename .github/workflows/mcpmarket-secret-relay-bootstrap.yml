name: MCP Market encrypted relay bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'automation/mcpmarket/relay/bootstrap-trigger.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: mcpmarket-relay-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Generate one-day RSA relay key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/mcpmarket/relay /tmp/mcpmarket-relay-private
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/mcpmarket-relay-private/private.pem 2>/dev/null
          openssl pkey -in /tmp/mcpmarket-relay-private/private.pem -pubout -out automation/mcpmarket/relay/public.pem
          printf '%s\n' "$GITHUB_RUN_ID" > automation/mcpmarket/relay/bootstrap-run-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mcpmarket-relay-private
          path: /tmp/mcpmarket-relay-private/private.pem
          retention-days: 1
          if-no-files-found: error
      - name: Publish public half and run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Maya Chen'
          git config user.email 'evanbrown3000@gmail.com'
          git pull --rebase origin main
          git add automation/mcpmarket/relay/public.pem automation/mcpmarket/relay/bootstrap-run-id.txt
          git commit -m 'chore: publish ephemeral MCP Market relay public key'
          git push origin HEAD:main
