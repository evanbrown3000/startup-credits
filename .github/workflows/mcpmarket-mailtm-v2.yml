name: MCP Market onboarding-aware publication v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket-mailtm-v2/trigger.txt'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-mailtm-v2-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chrome and open encrypted input channel
        shell: bash
        run: |
          set -euo pipefail
          npm --silent --no-progress --no-audit --no-fund install playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=mcpmarket-mailtm-v2' \
            -keyout /tmp/channel-key.pem -out /tmp/channel-cert.pem >/dev/null 2>&1
          CERT_B64="$(base64 -w0 /tmp/channel-cert.pem)"
          {
            echo '<!-- mcpmarket-mailtm-v2-cert -->'
            echo '**MCP Market onboarding-aware encrypted input channel**'
            echo '```text'
            echo "$CERT_B64"
            echo '```'
          } >/tmp/cert-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/cert-comment.md >/dev/null
      - name: Receive encrypted credentials and product
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/input.cms.b64
          for _ in $(seq 1 90); do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" >/tmp/comments.json
            if python3 - <<'PY'
          import json,re,sys
          comments=json.load(open('/tmp/comments.json'))
          bodies=[c.get('body','') for c in comments if '<!-- mcpmarket-mailtm-v2-input -->' in c.get('body','')]
          if not bodies: sys.exit(1)
          m=re.search(r'<!-- mcpmarket-mailtm-v2-input -->\s*```(?:text)?\s*([A-Za-z0-9+/=\r\n]+?)\s*```',bodies[-1],re.S)
          if not m: sys.exit(1)
          open('/tmp/input.cms.b64','w').write(''.join(m.group(1).split()))
          PY
            then break; fi
            sleep 5
          done
          test -s /tmp/input.cms.b64
          base64 -d /tmp/input.cms.b64 >/tmp/input.cms
          openssl cms -decrypt -binary -inform DER -in /tmp/input.cms \
            -recip /tmp/channel-cert.pem -inkey /tmp/channel-key.pem -out /tmp/input.json
          python3 - <<'PY'
          import base64,json,os
          p=json.load(open('/tmp/input.json'))
          for k in ('mailbox_password','provider_password','skill_md_b64','title','description','price'):
              if not p.get(k): raise SystemExit('missing '+k)
          os.makedirs('/tmp/product',exist_ok=True)
          open('/tmp/product/SKILL.md','wb').write(base64.b64decode(p['skill_md_b64']))
          PY
      - name: Create, confirm, onboard, and publish
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const crypto=require('crypto');
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/input.json','utf8'));
          const PRODUCT='/tmp/product/SKILL.md';
          const compact=(s,n=4200)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          const redactUrl=(u)=>{try{const x=new URL(String(u));for(const k of [...x.searchParams.keys()])if(/token|code|access|refresh|secret/i.test(k))x.searchParams.set(k,'[redacted]');if(x.hash)x.hash='#[redacted]';return x.toString()}catch(_){return compact(u,600)}};
          async function api(url,options={}){const r=await fetch(url,options),raw=await r.text();let d;try{d=raw?JSON.parse(raw):{}}catch(_){d={raw:raw.slice(0,1800)}}if(!r.ok)throw new Error(`HTTP ${r.status} ${url}: ${raw.slice(0,500)}`);return d}
          async function snap(page,label){return{label,url:redactUrl(page.url()),title:await page.title().catch(()=>''),body:compact(await page.locator('body').innerText().catch(()=>'')),buttons:(await page.getByRole('button').allTextContents().catch(()=>[])).slice(0,100),links:(await page.locator('a').evaluateAll(es=>es.slice(0,130).map(e=>({text:(e.innerText||'').trim().slice(0,120),href:e.href}))).catch(()=>[])).map(x=>({text:x.text,href:redactUrl(x.href)})),inputs:(await page.locator('input,textarea,select').evaluateAll(es=>es.slice(0,100).map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',accept:e.accept||''}))).catch(()=>[])}}
          async function click(page,res){for(const re of res){for(const l of [page.getByRole('button',{name:re}),page.getByRole('link',{name:re})]){try{if(await l.count()){await l.last().click({timeout:7000});return true}}catch(_){}}}return false}
          async function fill(page,res,value){for(const re of res){for(const l of [page.getByLabel(re),page.getByPlaceholder(re)]){try{if(await l.count()){await l.first().fill(String(value));return true}}catch(_){}}}return false}
          async function fillMeta(page,re,value){const nodes=page.locator('input,textarea');for(let i=0;i<await nodes.count();i++){const n=nodes.nth(i),m=((await n.getAttribute('name'))||'')+' '+((await n.getAttribute('placeholder'))||'')+' '+((await n.getAttribute('aria-label'))||'');if(re.test(m)){try{await n.fill(String(value));return true}catch(_){}}}return false}
          function linksFrom(text){const decoded=String(text||'').replace(/&amp;/g,'&').replace(/&#x3D;/gi,'=').replace(/&#61;/g,'=');return[...new Set((decoded.match(/https?:\/\/[^\s"'<>]+/g)||[]).map(x=>x.replace(/[),.;]+$/,'')))]}
          async function finishOnboarding(page,out){
            for(let i=0;i<14;i++){
              if(!page.url().includes('/signup/onboarding'))return true;
              out.snapshots.push(await snap(page,`onboarding-${i}`));
              let acted=false;
              if(await click(page,[/^engineering$/i]))acted=true;
              else if(await click(page,[/^skip$/i]))acted=true;
              else if(await click(page,[/^continue$|^next$|^finish$|^done$/i]))acted=true;
              else{
                const texts=(await page.getByRole('button').allTextContents().catch(()=>[])).map(x=>x.trim()).filter(Boolean);
                const candidate=texts.find(t=>!/back|close|menu|sign out|log out/i.test(t));
                if(candidate){try{await page.getByRole('button',{name:candidate,exact:true}).last().click({timeout:6000});acted=true}catch(_){}}
              }
              if(!acted)break;
              await page.waitForTimeout(1300);
            }
            return !page.url().includes('/signup/onboarding');
          }
          (async()=>{
            const out={provider:'mcpmarket.com',product:p.title,price_usd:Number(p.price),mailbox_provider:'mail.tm',mailbox_created:false,account_created:false,confirmation_received:false,email_confirmed:false,onboarding_completed:false,authenticated:false,seller_onboarding:false,skill_uploaded:false,listing_published:false,public_url:null,public_readback:false,income:0,status:'started',snapshots:[]};
            let address='',mailboxId='',mailToken='';
            const browser=await chromium.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:1440,height:1000}}),page=await context.newPage();
            try{
              const domains=await api('https://api.mail.tm/domains?page=1');
              const domain=(domains['hydra:member']||[]).find(d=>d.isActive!==false&&d.isPrivate!==true);
              if(!domain?.domain)throw new Error('mail.tm returned no active public domain');
              address=`cognilode-${Date.now()}-${crypto.randomBytes(4).toString('hex')}@${domain.domain}`;
              const acct=await api('https://api.mail.tm/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,password:p.mailbox_password})});
              mailboxId=acct.id||'';
              const tok=await api('https://api.mail.tm/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address,password:p.mailbox_password})});
              mailToken=tok.token||'';if(!mailToken)throw new Error('mail.tm token missing');
              out.mailbox_created=true;out.account_email=address;

              await page.goto('https://app.mcpmarket.com/signup',{waitUntil:'domcontentloaded',timeout:45000});
              await page.getByRole('button',{name:/^sign up with email$/i}).click({timeout:12000});
              const name=page.getByLabel(/^name$/i);if(await name.count())await name.fill('Evan Brown');else await page.getByPlaceholder(/your name/i).fill('Evan Brown');
              await page.locator('input[type=email]').fill(address);await page.locator('input[type=password]').fill(p.provider_password);
              const create=page.getByRole('button',{name:/^create account$/i});if(await create.count())await create.last().click({timeout:12000});else await page.locator('form button[type=submit]').last().click({timeout:12000});
              await page.waitForTimeout(2200);let body=compact(await page.locator('body').innerText());out.snapshots.push(await snap(page,'signup-result'));
              if(!/check your email|confirmation link|verify your email/i.test(body))throw new Error(`signup did not reach confirmation: ${body.slice(0,700)}`);out.account_created=true;

              let confirm=null,deadline=Date.now()+150000;
              while(Date.now()<deadline&&!confirm){const list=await api('https://api.mail.tm/messages?page=1',{headers:{Authorization:`Bearer ${mailToken}`}});for(const m of list['hydra:member']||[]){const full=await api(`https://api.mail.tm/messages/${m.id}`,{headers:{Authorization:`Bearer ${mailToken}`}});const mat=[full.subject,full.intro,full.text,Array.isArray(full.html)?full.html.join('\n'):full.html].filter(Boolean).join('\n');confirm=linksFrom(mat).find(u=>/supabase\.co\/auth\/v1\/verify|token_hash=|type=signup|app\.mcpmarket\.com\/auth\/callback/i.test(u))||null;if(confirm)break}if(!confirm)await new Promise(r=>setTimeout(r,3000))}
              if(!confirm)throw new Error('confirmation mail did not arrive within 150 seconds');out.confirmation_received=true;
              await page.goto(confirm,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1600);body=compact(await page.locator('body').innerText());out.email_confirmed=!/invalid|expired|unable to verify|error/i.test(body);out.snapshots.push(await snap(page,'confirmation-result'));if(!out.email_confirmed)throw new Error(`confirmation rejected: ${body.slice(0,700)}`);

              out.onboarding_completed=await finishOnboarding(page,out);
              if(!out.onboarding_completed){
                await page.goto('https://app.mcpmarket.com/dashboard',{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1300);
                if(page.url().includes('/signup/onboarding'))out.onboarding_completed=await finishOnboarding(page,out);
              }
              out.authenticated=!page.url().includes('/login');out.snapshots.push(await snap(page,'post-onboarding'));
              if(!out.authenticated)throw new Error('confirmation session did not remain authenticated');

              await page.goto('https://app.mcpmarket.com/sell?source=sell-page',{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1600);out.snapshots.push(await snap(page,'seller-entry'));
              for(let step=0;step<22;step++){
                body=compact(await page.locator('body').innerText());const low=body.toLowerCase();
                if(/published|listing is live|view public page|live paid/i.test(low)){out.listing_published=true;break}
                if(page.url().includes('/login'))throw new Error('seller route redirected to login');
                if(page.url().includes('/signup/onboarding')){out.onboarding_completed=await finishOnboarding(page,out);continue}
                if(/organization|workspace/.test(low)){await fill(page,[/organization name|workspace name/i],p.organization||'Cognilode');await fill(page,[/slug|handle/i],p.organization_slug||'cognilode');await fillMeta(page,/organization|workspace|name/i,p.organization||'Cognilode');await fillMeta(page,/slug|handle/i,p.organization_slug||'cognilode');if(await click(page,[/^create organization$|^create workspace$|^continue$|^next$/i])){out.seller_onboarding=true;await page.waitForTimeout(1400);out.snapshots.push(await snap(page,`organization-${step}`));continue}}
                if(/storefront|seller profile|start selling|set up.*store/.test(low)){await fill(page,[/display name|seller name/i],p.seller_name||'Cognilode');await fill(page,[/handle|username|slug/i],p.handle||'cognilode');await fill(page,[/bio|about|description/i],p.seller_bio||'Evidence-driven agent skills for commercial execution and provider validation.');if(await click(page,[/^start selling$|^set up.*store$|^create.*seller$|^save$|^continue$|^next$/i])){out.seller_onboarding=true;await page.waitForTimeout(1400);out.snapshots.push(await snap(page,`seller-${step}`));continue}}
                if(/connect stripe|payout|payments setup/i.test(low)){if(await click(page,[/^skip for now$|^do this later$|^continue without payouts$/i])){await page.waitForTimeout(1200);out.snapshots.push(await snap(page,`payout-skip-${step}`));continue}}
                const file=page.locator('input[type=file]');
                if(await file.count()){await file.first().setInputFiles(PRODUCT);out.skill_uploaded=true;await page.waitForTimeout(1400);out.snapshots.push(await snap(page,`skill-uploaded-${step}`))}
                else if(await click(page,[/^upload.*skill$|^new skill$|^create skill$|^add skill$|^import skill$|^connect skill$/i])){await page.waitForTimeout(1400);out.snapshots.push(await snap(page,`open-upload-${step}`));continue}
                const sourceUrl=p.source_url||'https://raw.githubusercontent.com/evanbrown3000/startup-credits/agent/mcpmarket-mailtm-1434/automation/mcpmarket-mailtm/product/SKILL.md';
                await fill(page,[/github url|repository url|source url|skill url/i],sourceUrl);await fillMeta(page,/github|repository|source.*url|skill.*url/i,sourceUrl);
                await fill(page,[/skill name|listing title|title/i],p.title);await fill(page,[/description|summary/i],p.description);await fill(page,[/price|amount/i],p.price);await fillMeta(page,/title|skill.*name|listing.*name/i,p.title);await fillMeta(page,/description|summary/i,p.description);await fillMeta(page,/price|amount/i,p.price);
                if(await click(page,[/^publish$|^go live$|^create listing$|^save and publish$|^list skill$|^continue$|^next$|^save$|^import$/i])){await page.waitForTimeout(2100);out.snapshots.push(await snap(page,`advance-${step}`));continue}
                break;
              }
              body=compact(await page.locator('body').innerText());out.listing_published=out.listing_published||(/published|listing is live|view public page|live paid/i.test(body)&&!/not published|error/i.test(body));
              const links=await page.locator('a').evaluateAll(es=>es.map(e=>({text:(e.innerText||'').trim(),href:e.href})));const c=links.find(x=>/view public page|public listing|storefront/i.test(x.text))||links.find(x=>/mcpmarket\.com\/@|\/tools\/skills\//.test(x.href));out.public_url=c?c.href:null;out.snapshots.push(await snap(page,'seller-terminal'));
              if(out.public_url){const pub=await browser.newContext({viewport:{width:1440,height:1000}}),q=await pub.newPage(),r=await q.goto(out.public_url,{waitUntil:'domcontentloaded',timeout:45000});await q.waitForTimeout(900);out.public_readback=Boolean(r&&r.status()<400&&/provider reality check/i.test(compact(await q.locator('body').innerText())));out.snapshots.push(await snap(q,'public-readback'));await pub.close()}
              out.status=out.listing_published?(out.public_readback?'published_publicly_verified':'published_public_readback_unverified'):'publish_incomplete';
            }catch(e){out.status='error';out.error=String(e.message||e).slice(0,1200);try{out.snapshots.push(await snap(page,'error-terminal'))}catch(_){}}
            out.finished_at=new Date().toISOString();fs.writeFileSync('/tmp/result.json',JSON.stringify(out,null,2)+'\n');fs.writeFileSync('/tmp/custody.json',JSON.stringify({mailbox_provider:'mail.tm',mailbox_address:address,mailbox_password:p.mailbox_password,mailbox_account_id:mailboxId,provider:'mcpmarket.com',provider_email:address,provider_password:p.provider_password,public_url:out.public_url,created_at:new Date().toISOString()},null,2)+'\n',{mode:0o600});await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Post exact terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income":0}' >/tmp/result.json
          {
            echo '<!-- mcpmarket-mailtm-v2-terminal -->'
            echo '**MCP Market onboarding-aware v2 — terminal result**'
            echo '```json'
            cat /tmp/result.json
            echo '```'
          } >/tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/comment.md >/dev/null
