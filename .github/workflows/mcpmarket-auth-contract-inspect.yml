name: MCP Market auth contract inspect

on:
  push:
    branches: [main]
    paths:
      - 'automation/mcpmarket/auth-inspect-trigger.txt'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm --silent --no-progress --no-audit --no-fund install playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect exact login bundle for recovery contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage();
            const out={provider:'mcpmarket',resources:[],matches:[]};
            try{
              await p.goto('https://app.mcpmarket.com/login',{waitUntil:'networkidle',timeout:45000});
              const emailMode=p.getByRole('button',{name:/log in with email/i}); if(await emailMode.count()) await emailMode.click();
              await p.waitForTimeout(500);
              out.elements=await p.locator('input,button,a,form').evaluateAll(es=>es.slice(0,120).map(e=>({tag:e.tagName.toLowerCase(),type:e.getAttribute('type'),name:e.getAttribute('name'),text:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||'').trim().slice(0,160),href:e.getAttribute('href'),action:e.getAttribute('action')})));
              const urls=await p.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name).filter(n=>n.includes('.js')));
              out.resources=urls.slice(0,80).map(u=>{try{let x=new URL(u);return x.origin+x.pathname}catch{return u}});
              for(const u of urls.slice(0,80)){
                let t=''; try{t=await (await fetch(u)).text()}catch{}
                for(const pat of ['resetPasswordForEmail','auth/v1/recover','mcpmarket.supabase.co','forgot-password','reset-password']){
                  let i=t.indexOf(pat); if(i>=0) out.matches.push({resource:(()=>{try{let x=new URL(u);return x.pathname}catch{return u}})(),pattern:pat,context:t.slice(Math.max(0,i-500),Math.min(t.length,i+1000)).replace(/\s+/g,' ').slice(0,1600)});
                }
              }
            }catch(e){out.error=String(e.message||e).slice(0,1000)} finally{await b.close()}
            fs.writeFileSync('automation/mcpmarket/auth-contract-inspect.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Persist bounded inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Maya Chen'
          git config user.email 'evanbrown3000@gmail.com'
          git pull --rebase origin main
          git add automation/mcpmarket/auth-contract-inspect.json
          git commit -m 'chore: record MCP Market auth contract' || exit 0
          git push origin HEAD:main
