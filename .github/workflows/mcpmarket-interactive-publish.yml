name: MCP Market encrypted interactive publisher

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/mcpmarket/interactive-trigger.txt'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mcpmarket-interactive-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROVIDER_EMAIL: evanbrown3000+mcpmarket1359@gmail.com
      PROVIDER_NAME: Evan Brown
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm --silent --no-progress --no-audit --no-fund install playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Create ephemeral encrypted channel and seller account
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=mcpmarket-interactive-run' \
            -keyout /tmp/mcpmarket-key.pem -out /tmp/mcpmarket-cert.pem >/dev/null 2>&1
          CERT_B64="$(base64 -w0 /tmp/mcpmarket-cert.pem)"
          {
            echo '<!-- mcpmarket-ephemeral-cert -->'
            echo '**MCP Market encrypted input channel is live.**'
            echo 'The following one-run certificate accepts only CMS-encrypted input for this active job:'
            echo '```text'
            echo "$CERT_B64"
            echo '```'
          } >/tmp/cert-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/cert-comment.md >/dev/null

          node <<'NODE'
          const { chromium } = require('playwright');
          const crypto = require('crypto');
          const fs = require('fs');
          const text = (s,n=2200)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          async function clickNamed(page,re){
            for (const loc of [page.getByRole('button',{name:re}),page.getByRole('link',{name:re}),page.getByText(re,{exact:false})]){
              try{if(await loc.count()){await loc.first().click({timeout:8000});return true}}catch(e){}
            }
            return false;
          }
          async function fill(page,re,value){
            for (const loc of [page.getByLabel(re),page.getByPlaceholder(re),page.locator('input[type=email]'),page.locator('input[type=password]')]){
              try{if(await loc.count()){await loc.first().fill(value);return true}}catch(e){}
            }
            return false;
          }
          (async()=>{
            const email=process.env.PROVIDER_EMAIL;
            const name=process.env.PROVIDER_NAME;
            const password=`Mm!${crypto.randomBytes(30).toString('base64url')}9a`;
            fs.writeFileSync('/tmp/mcpmarket-password',password,{mode:0o600});
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const out={provider:'mcpmarket.com',email,provider_mutation:false,account_created:false,status:'unknown'};
            try{
              await page.goto('https://app.mcpmarket.com/signup',{waitUntil:'domcontentloaded',timeout:45000});
              await clickNamed(page,/sign up with email/i);
              await fill(page,/name/i,name);
              await fill(page,/email/i,email);
              await fill(page,/password/i,password);
              await clickNamed(page,/create account|sign up|continue/i);
              await page.waitForTimeout(2500);
              const body=text(await page.locator('body').innerText());
              out.url=page.url();out.body_excerpt=body;
              if(/check your email|confirmation link|verify your email/i.test(body)){
                out.provider_mutation=true;out.account_created=true;out.status='confirmation_required';
              }else if(/already.*account/i.test(body)){
                out.status='already_exists';
              }else{
                out.status='signup_unclassified';
              }
            }catch(e){out.status='error';out.error=String(e.message||e).slice(0,800);try{out.url=page.url();out.body_excerpt=text(await page.locator('body').innerText())}catch(_){} }
            await browser.close();
            fs.writeFileSync('/tmp/signup-result.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          {
            echo '<!-- mcpmarket-signup-result -->'
            echo '**MCP Market reachable-account result**'
            echo '```json'
            cat /tmp/signup-result.json
            echo '```'
            echo 'The job is now waiting for one CMS-encrypted payload containing the confirmation URL and private SKILL.md.'
          } >/tmp/signup-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/signup-comment.md >/dev/null
      - name: Wait for encrypted confirmation and skill payload
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for _ in $(seq 1 120); do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > /tmp/comments.json
            python3 - <<'PY'
          import json,re
          comments=json.load(open('/tmp/comments.json'))
          bodies=[c.get('body','') for c in comments if '<!-- mcpmarket-cms-input -->' in c.get('body','')]
          if not bodies: raise SystemExit(1)
          body=bodies[-1]
          m=re.search(r'<!-- mcpmarket-cms-input -->\s*```(?:text)?\s*([A-Za-z0-9+/=\r\n]+?)\s*```',body,re.S)
          if not m: raise SystemExit(1)
          open('/tmp/payload.cms.b64','w').write(''.join(m.group(1).split()))
          PY
            if [ -s /tmp/payload.cms.b64 ]; then FOUND=1; break; fi
            sleep 10
          done
          if [ "$FOUND" != 1 ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST \
              -f body='<!-- mcpmarket-terminal --><b>MCP Market publisher timed out waiting for encrypted confirmation payload; no publication claimed.</b>' >/dev/null
            exit 42
          fi
          base64 -d /tmp/payload.cms.b64 > /tmp/payload.cms
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/payload.cms -recip /tmp/mcpmarket-cert.pem -inkey /tmp/mcpmarket-key.pem \
            -out /tmp/payload.json
          python3 - <<'PY'
          import base64,json,os
          p=json.load(open('/tmp/payload.json'))
          required=['confirmation_url','skill_md_b64','title','description','price']
          miss=[k for k in required if not p.get(k)]
          if miss: raise SystemExit('missing:'+','.join(miss))
          os.makedirs('/tmp/mcpmarket-product',exist_ok=True)
          open('/tmp/mcpmarket-product/SKILL.md','wb').write(base64.b64decode(p['skill_md_b64']))
          PY
      - name: Confirm, authenticate, and publish paid skill
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/payload.json','utf8'));
          const email=process.env.PROVIDER_EMAIL;
          const password=fs.readFileSync('/tmp/mcpmarket-password','utf8');
          const skillPath='/tmp/mcpmarket-product/SKILL.md';
          const clean=(s,n=2600)=>String(s||'').replace(/\s+/g,' ').trim().slice(0,n);
          async function snap(page,label){
            return {label,url:page.url(),title:await page.title().catch(()=>''),body:clean(await page.locator('body').innerText().catch(()=>'')),buttons:(await page.getByRole('button').allTextContents().catch(()=>[])).slice(0,50),links:(await page.locator('a').evaluateAll(es=>es.slice(0,80).map(e=>({text:(e.innerText||'').trim().slice(0,100),href:e.href}))).catch(()=>[])),inputs:(await page.locator('input,textarea,select').evaluateAll(es=>es.slice(0,60).map(e=>({tag:e.tagName,type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',accept:e.accept||''}))).catch(()=>[]))};
          }
          async function clickNamed(page,re){
            for(const loc of [page.getByRole('button',{name:re}),page.getByRole('link',{name:re}),page.getByText(re,{exact:false})]){
              try{if(await loc.count()){await loc.first().click({timeout:7000});return true}}catch(e){}
            }
            return false;
          }
          async function fillTarget(page,res,value){
            for(const re of res){
              for(const loc of [page.getByLabel(re),page.getByPlaceholder(re)]){
                try{if(await loc.count()){await loc.first().fill(String(value));return true}}catch(e){}
              }
            }
            return false;
          }
          async function maybeFillByInput(page,matcher,value){
            const loc=page.locator('input,textarea').filter({has:page.locator('nothing')});
            const count=await page.locator('input,textarea').count();
            for(let i=0;i<count;i++){
              const el=page.locator('input,textarea').nth(i);
              const meta=((await el.getAttribute('name'))||'')+' '+((await el.getAttribute('placeholder'))||'')+' '+((await el.getAttribute('aria-label'))||'');
              if(matcher.test(meta)){try{await el.fill(String(value));return true}catch(e){}}
            }
            return false;
          }
          (async()=>{
            const out={provider:'mcpmarket.com',email,confirmation_attempted:false,email_confirmed:false,authenticated:false,seller_onboarding:false,skill_uploaded:false,listing_published:false,public_url:null,price:Number(payload.price),income:0,status:'started',snapshots:[]};
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            try{
              out.confirmation_attempted=true;
              await page.goto(payload.confirmation_url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              let body=clean(await page.locator('body').innerText());
              out.email_confirmed=!/invalid|expired|unable to verify|error/i.test(body);
              out.snapshots.push(await snap(page,'confirmation'));

              await page.goto('https://app.mcpmarket.com/login',{waitUntil:'domcontentloaded',timeout:45000});
              await clickNamed(page,/log in with email/i);
              await fillTarget(page,[/email/i],email);
              await fillTarget(page,[/password/i],password);
              await clickNamed(page,/log in|sign in|continue/i);
              await page.waitForTimeout(2500);
              body=clean(await page.locator('body').innerText());
              out.authenticated=!page.url().includes('/login') && !/invalid.*password|welcome back/i.test(body);
              out.snapshots.push(await snap(page,'post-login'));

              await page.goto('https://app.mcpmarket.com/sell?source=sell-page',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              out.snapshots.push(await snap(page,'seller-entry'));

              for(let step=0;step<14;step++){
                body=clean(await page.locator('body').innerText());
                const lower=body.toLowerCase();
                if(/published|listing is live|view public page|live paid/i.test(lower)){
                  out.listing_published=true;break;
                }

                if(/organization|workspace/.test(lower)){
                  await fillTarget(page,[/organization name|workspace name/i],payload.organization||'Cognilode');
                  await fillTarget(page,[/slug|handle/i],payload.organization_slug||'cognilode');
                  await maybeFillByInput(page,/organization|workspace|name/i,payload.organization||'Cognilode');
                  await maybeFillByInput(page,/slug|handle/i,payload.organization_slug||'cognilode');
                  if(await clickNamed(page,/create organization|create workspace|continue|next/i)){out.seller_onboarding=true;await page.waitForTimeout(1600);out.snapshots.push(await snap(page,`org-${step}`));continue;}
                }

                if(/storefront|seller profile|start selling|set up.*store/.test(lower)){
                  await fillTarget(page,[/display name|seller name|name/i],payload.seller_name||'Cognilode');
                  await fillTarget(page,[/handle|username|slug/i],payload.handle||'cognilode');
                  await fillTarget(page,[/bio|about|description/i],payload.seller_bio||'Evidence-driven agent skills for commercial execution and provider validation.');
                  if(await clickNamed(page,/start selling|set up.*store|create.*seller|save|continue|next/i)){out.seller_onboarding=true;await page.waitForTimeout(1600);out.snapshots.push(await snap(page,`seller-${step}`));continue;}
                }

                if(await page.locator('input[type=file]').count()){
                  await page.locator('input[type=file]').first().setInputFiles(skillPath);
                  out.skill_uploaded=true;
                  await page.waitForTimeout(1400);
                  out.snapshots.push(await snap(page,`uploaded-${step}`));
                }else if(await clickNamed(page,/upload.*skill|upload skill\.md|new skill|create skill|add skill|connect skill|import skill/i)){
                  await page.waitForTimeout(1400);out.snapshots.push(await snap(page,`open-upload-${step}`));continue;
                }

                await fillTarget(page,[/skill name|listing title|title|name/i],payload.title);
                await fillTarget(page,[/description|summary/i],payload.description);
                await fillTarget(page,[/price|amount/i],payload.price);
                await maybeFillByInput(page,/title|skill.*name|listing.*name/i,payload.title);
                await maybeFillByInput(page,/description|summary/i,payload.description);
                await maybeFillByInput(page,/price|amount/i,payload.price);

                if(await clickNamed(page,/publish|go live|create listing|save and publish|list skill|continue|next|save/i)){
                  await page.waitForTimeout(2200);out.snapshots.push(await snap(page,`advance-${step}`));continue;
                }
                break;
              }

              body=clean(await page.locator('body').innerText());
              out.listing_published=out.listing_published || (/published|listing is live|view public page|live paid/i.test(body) && !/not published|error/i.test(body));
              const links=await page.locator('a').evaluateAll(es=>es.map(e=>({t:(e.innerText||'').trim(),h:e.href})));
              out.public_url=(links.find(x=>/view public page|public listing|storefront/i.test(x.t))||links.find(x=>/mcpmarket\.com\/@|\/tools\/skills\//.test(x.h))||{}).h||null;
              out.status=out.listing_published?'published':'publish_incomplete';
              out.snapshots.push(await snap(page,'terminal'));
            }catch(e){out.status='error';out.error=String(e.message||e).slice(0,900);try{out.snapshots.push(await snap(page,'error'))}catch(_){} }
            out.finished_at=new Date().toISOString();
            await browser.close();
            fs.writeFileSync('/tmp/publish-result.json',JSON.stringify(out,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Publish terminal result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/publish-result.json || printf '%s\n' '{"provider":"mcpmarket.com","status":"result_missing","listing_published":false,"income":0}' >/tmp/publish-result.json
          {
            echo '<!-- mcpmarket-terminal-result -->'
            echo '**MCP Market encrypted publisher — terminal result**'
            echo '```json'
            cat /tmp/publish-result.json
            echo '```'
          } >/tmp/final-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --method POST -F body=@/tmp/final-comment.md >/dev/null
